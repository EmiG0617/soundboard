<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --panel: #13161e;
      --border: #1e2330;
      --accent-delineator: #f59e0b;
      --accent-lighting: #38bdf8;
      --accent-sign: #f87171;
      --accent-striping: #a3e635;
      --accent-rpm: #c084fc;
      --text: #e2e8f0;
      --muted: #64748b;
      --btn-bg: #1a1f2e;
      --btn-hover: #242a3b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      padding: 1rem 0.75rem 5rem;
    }

    h1 {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(1.4rem, 6vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 1.25rem;
      color: var(--text);
      position: relative;
    }

    h1::after {
      content: '';
      display: block;
      width: 60px;
      height: 3px;
      background: var(--text);
      margin: 0.5rem auto 0;
      opacity: 0.3;
    }

    /* Accordion sections */
    .section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-left-width: 4px;
      border-radius: 4px;
      margin-bottom: 0.6rem;
      overflow: hidden;
    }

    .section--delineator { border-left-color: var(--accent-delineator); }
    .section--lighting   { border-left-color: var(--accent-lighting); }
    .section--sign       { border-left-color: var(--accent-sign); }
    .section--striping   { border-left-color: var(--accent-striping); }
    .section--rpm        { border-left-color: var(--accent-rpm); }

    .section-toggle {
      width: 100%;
      background: none;
      border: none;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      gap: 0.5rem;
    }

    .section-title {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section--delineator .section-title { color: var(--accent-delineator); }
    .section--lighting   .section-title { color: var(--accent-lighting); }
    .section--sign       .section-title { color: var(--accent-sign); }
    .section--striping   .section-title { color: var(--accent-striping); }
    .section--rpm        .section-title { color: var(--accent-rpm); }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .chevron {
      color: var(--muted);
      font-size: 0.75rem;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .section.open .chevron {
      transform: rotate(180deg);
    }

    .section-body {
      display: none;
      padding: 0 0.75rem 0.75rem;
    }

    .section.open .section-body {
      display: block;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
    }

    button.sound-btn {
      background: var(--btn-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.75rem 0.5rem;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.03em;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
      line-height: 1.3;
      min-height: 52px;
      -webkit-tap-highlight-color: transparent;
    }

    button.sound-btn:active {
      transform: scale(0.95);
    }

    .section--delineator button.sound-btn:active { border-color: var(--accent-delineator); color: var(--accent-delineator); background: #2a1f00; }
    .section--lighting   button.sound-btn:active { border-color: var(--accent-lighting);   color: var(--accent-lighting);   background: #001f2a; }
    .section--sign       button.sound-btn:active { border-color: var(--accent-sign);       color: var(--accent-sign);       background: #2a1010; }
    .section--striping   button.sound-btn:active { border-color: var(--accent-striping);   color: var(--accent-striping);   background: #1a2a00; }
    .section--rpm        button.sound-btn:active { border-color: var(--accent-rpm);        color: var(--accent-rpm);        background: #1e0a2a; }

    button.sound-btn.playing {
      animation: pulse 0.3s ease;
    }

    @keyframes pulse {
      0%   { opacity: 1; }
      50%  { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Desktop: go back to grid layout */
    @media (min-width: 640px) {
      body { padding: 2rem 1.5rem 4rem; }

      .section {
        border-left-width: 1px;
        border-top-width: 3px;
        margin-bottom: 0;
      }
      .section--delineator { border-top-color: var(--accent-delineator); border-left-color: var(--border); }
      .section--lighting   { border-top-color: var(--accent-lighting);   border-left-color: var(--border); }
      .section--sign       { border-top-color: var(--accent-sign);       border-left-color: var(--border); }
      .section--striping   { border-top-color: var(--accent-striping);   border-left-color: var(--border); }
      .section--rpm        { border-top-color: var(--accent-rpm);        border-left-color: var(--border); }

      .sections-wrapper {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1.5rem;
        max-width: 1200px;
        margin: 0 auto;
      }

      /* Always show body on desktop */
      .section-body { display: block !important; padding: 0 1.25rem 1.25rem; }
      .section-toggle { padding: 1.25rem 1.25rem 0.75rem; cursor: default; }
      .chevron { display: none; }

      button.sound-btn {
        font-size: 0.78rem;
        padding: 0.6rem 0.5rem;
        min-height: auto;
        text-align: left;
      }

      .buttons {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>

<h1>Soundboard</h1>

<div class="sections-wrapper">

  <!-- Delineator Commands -->
  <div class="section section--delineator open">
    <button class="section-toggle" onclick="toggleSection(this)">
      <span class="section-title">Delineator Commands</span>
      <span class="chevron">▼</span>
    </button>
    <div class="section-body">
      <div class="buttons">
        <button class="sound-btn" onclick="playSound('missing_delineator.mp3', this)">Missing Delineator</button>
        <button class="sound-btn" onclick="playSound('damaged_delineator.mp3', this)">Damaged Delineator</button>
        <button class="sound-btn" onclick="playSound('dead_delineator.mp3', this)">Dead Delineator</button>
        <button class="sound-btn" onclick="playSound('good_delineator.mp3', this)">Good Delineator</button>
        <button class="sound-btn" onclick="playSound('leaning_delineator.mp3', this)">Leaning Delineator</button>
        <button class="sound-btn" onclick="playSound('faded_delineator.mp3', this)">Faded Delineator</button>
      </div>
    </div>
  </div>

  <!-- Lighting Commands -->
  <div class="section section--lighting">
    <button class="section-toggle" onclick="toggleSection(this)">
      <span class="section-title">Lighting Commands</span>
      <span class="chevron">▼</span>
    </button>
    <div class="section-body">
      <div class="buttons">
        <button class="sound-btn" onclick="playSound('damaged_lighting.mp3', this)">Damaged Lighting</button>
        <button class="sound-btn" onclick="playSound('missing_lighting.mp3', this)">Missing Lighting</button>
        <button class="sound-btn" onclick="playSound('lighting_off.mp3', this)">Lighting Off</button>
        <button class="sound-btn" onclick="playSound('good_lighting.mp3', this)">Good Lighting</button>
        <button class="sound-btn" onclick="playSound('leaning_lighting.mp3', this)">Leaning Lighting</button>
      </div>
    </div>
  </div>

  <!-- Sign Commands -->
  <div class="section section--sign">
    <button class="section-toggle" onclick="toggleSection(this)">
      <span class="section-title">Sign Commands</span>
      <span class="chevron">▼</span>
    </button>
    <div class="section-body">
      <div class="buttons">
        <button class="sound-btn" onclick="playSound('dead_sign.mp3', this)">Dead Sign</button>
        <button class="sound-btn" onclick="playSound('missing_sign.mp3', this)">Missing Sign</button>
        <button class="sound-btn" onclick="playSound('damaged_sign.mp3', this)">Damaged Sign</button>
        <button class="sound-btn" onclick="playSound('good_sign.mp3', this)">Good Sign</button>
        <button class="sound-btn" onclick="playSound('leaning_sign.mp3', this)">Leaning Sign</button>
        <button class="sound-btn" onclick="playSound('faded_sign.mp3', this)">Faded Sign</button>
      </div>
    </div>
  </div>

  <!-- Striping Commands -->
  <div class="section section--striping">
    <button class="section-toggle" onclick="toggleSection(this)">
      <span class="section-title">Striping Commands</span>
      <span class="chevron">▼</span>
    </button>
    <div class="section-body">
      <div class="buttons">
        <button class="sound-btn" onclick="playSound('not_good_striping.mp3', this)">Not Good Striping</button>
        <button class="sound-btn" onclick="playSound('missing_striping.mp3', this)">Missing Striping</button>
        <button class="sound-btn" onclick="playSound('dead_striping.mp3', this)">Dead Striping</button>
        <button class="sound-btn" onclick="playSound('good_striping.mp3', this)">Good Striping</button>
        <button class="sound-btn" onclick="playSound('faded_striping.mp3', this)">Faded Striping</button>
      </div>
    </div>
  </div>

  <!-- Reflective Pavement Marker Commands -->
  <div class="section section--rpm">
    <button class="section-toggle" onclick="toggleSection(this)">
      <span class="section-title">Reflective Pavement Marker Commands</span>
      <span class="chevron">▼</span>
    </button>
    <div class="section-body">
      <div class="buttons">
        <button class="sound-btn" onclick="playSound('rpm_less_than_10_missing.mp3', this)">Less Than 10% Missing</button>
        <button class="sound-btn" onclick="playSound('rpm_10_to_50_missing.mp3', this)">10 to 50% Missing</button>
        <button class="sound-btn" onclick="playSound('rpm_more_than_50_missing.mp3', this)">More Than 50% Missing</button>
      </div>
    </div>
  </div>

</div>

<script>
  function playSound(file, btn) {
    const audio = new Audio(file);
    audio.play();
    if (btn) {
      btn.classList.add('playing');
      setTimeout(() => btn.classList.remove('playing'), 300);
    }
  }

  function toggleSection(toggleBtn) {
    const section = toggleBtn.closest('.section');
    section.classList.toggle('open');
  }
</script>

</body>
</html>
